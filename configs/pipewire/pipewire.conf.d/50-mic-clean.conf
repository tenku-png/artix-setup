# Clean microphone without easyeffects: DeepFilterNet noise suppression as a
# virtual source "Clean Mic" (node.name mic_clean). Pick it as the input in
# Discord, games and OBS. Runs inside pipewire, no extra process.
# Needs: libdeep_filter_ladspa-bin (AUR).
# Install: ~/.config/pipewire/pipewire.conf.d/50-mic-clean.conf
context.modules = [
    {   name = libpipewire-module-filter-chain
        args = {
            node.description = "Clean Mic"
            media.name       = "Clean Mic"
            filter.graph = {
                nodes = [
                    {   type   = ladspa
                        name   = deepfilter
                        plugin = /usr/lib/ladspa/libdeep_filter_ladspa.so
                        label  = deep_filter_mono
                        control = {
                            "Attenuation Limit (dB)" = 100
                            "Post Filter Beta"       = 0.02
                        }
                    }
                ]
            }
            audio.rate     = 48000
            audio.position = [ MONO ]
            capture.props = {
                node.name    = "mic_clean_capture"
                node.passive = true
            }
            playback.props = {
                node.name   = "mic_clean"
                media.class = Audio/Source
            }
        }
    }
]
